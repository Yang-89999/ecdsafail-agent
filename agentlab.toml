# agentlab configuration. Paths are relative to nothing: use absolute paths (~ is expanded).
# Default layout: this repo and the harness checkout side by side.
challenge_dir = "~/ecdsafail-challenge"
adapter = "ecdsafail"

# "codex": run solvers through `codex exec` (auth: `codex login` or OPENAI_API_KEY)
# "openai": Responses API tool loop (auth: OPENAI_API_KEY)
backend = "codex"
model = "gpt-6-astra"   # as shown by /model inside codex; empty = Codex default
reasoning_effort = "high"

solvers = 2             # parallel executor slots (the Coordinator fills each free slot)
fast_shots = 9024       # same shots as the official run: eval adds ~15 s, and the fast score is then the official number
audit_threshold = 0.0     # any strict gain at 9024 shots goes to the audit (leaderboard steps are ~0.01 %)
solver_timeout_s = 28800  # 8 h safety cap per run; runs end on evidence (gain or no hope), not on the clock
explore_c = 0.6

submit_only_if_beats_best = true
min_relative_gain = 0.0
