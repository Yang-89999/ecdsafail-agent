# agentlab configuration. Paths are relative to nothing: use absolute paths (~ is expanded).
# Default layout: this repo and the harness checkout side by side.
challenge_dir = "~/ecdsafail-challenge"
adapter = "ecdsafail"

# "codex": run solvers through `codex exec` (auth: `codex login` or OPENAI_API_KEY)
# "openai": Responses API tool loop (auth: OPENAI_API_KEY)
backend = "codex"
model = "gpt-6-astra"   # as shown by /model inside codex; empty = Codex default
reasoning_effort = "high"

solvers = 2             # parallel solver worktrees per round
fast_shots = 1024       # the official run uses 9024; 64 shots showed 0.016 % noise against it
audit_threshold = 0.0005  # fast-score gain needed before the full official run
solver_timeout_s = 10800
explore_c = 0.6

submit_only_if_beats_best = true
min_relative_gain = 0.0
